.top{position:absolute;top:14px;inset-inline:14px;display:flex;justify-content:space-between}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:#06122899;color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px);font-size:18px}
.hc{position:absolute;bottom:56px;inset-inline:0;text-align:center}
.hc h1{font:700 40px 'Reem Kufi',serif;color:#fff;text-shadow:0 2px 14px #000}
.hc p{color:#e2b660;letter-spacing:4px;font:500 13px Montserrat,sans-serif;text-shadow:0 1px 8px #000}
.wave{position:absolute;bottom:0;width:100%;height:30px;stroke:var(--au);fill:none;stroke-width:1.5}
.gr{text-align:center;color:var(--mu);margin:6px 0 14px}
.gc{margin:0 18px 18px;padding:18px;border:1px solid var(--ln);border-radius:26px;background:radial-gradient(circle at 50% 0,#1c3560,var(--c1));text-align:center;color:#f2f4f8}
html[data-th=light] .gc{background:var(--c1);color:var(--tx)}
.gc small{color:var(--mu);font-weight:700}.gc small b{color:#4285f4;font-size:20px;margin-inline-start:6px}
.gc p{margin:6px 0 12px;font-weight:700}
.pill{display:inline-block;padding:11px 30px;border-radius:30px;background:#041229;color:#fff;text-decoration:none;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 18px}
.tile{position:relative;border:1px solid var(--ln);border-radius:22px;background:var(--c1);padding:20px 6px 54px;text-align:center;color:var(--tx)}
.tile::before{content:'';position:absolute;inset:4px;border:1px solid var(--ln);border-radius:18px;pointer-events:none}
.tile .ic{color:var(--au);width:44px;height:44px;stroke-width:1.3}
.tile b{display:block;font-size:17px;margin-top:6px}.tile small{color:var(--mu);font-size:12px;display:block;line-height:1.3}
.ch{position:absolute;bottom:10px;inset-inline:0;margin:auto;width:34px;height:34px;border-radius:50%;background:var(--c2);display:grid;place-items:center}
.sh{text-align:center;color:var(--au);margin:28px 0 12px;font-weight:700}
.chips{display:flex;gap:10px;overflow-x:auto;padding:0 18px 6px;scrollbar-width:none}
.chip{flex:none;width:96px;border:1px solid var(--ln);border-radius:20px;background:var(--c1);padding:12px 6px;text-align:center;font-size:14px;font-weight:700;color:var(--tx)}
.chip span{display:block;font-size:30px;line-height:1.3}
.br{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.bc{border:1px solid var(--ln);border-radius:24px;background:var(--c1);padding:16px}
.bc .ic{color:var(--au);width:22px;height:22px}.bc h3{font-size:18px;margin:10px 0 2px}.bc p{color:var(--mu);font-size:14px;margin-bottom:12px}
.bc .pill{display:block;text-align:center;padding:11px}
.fn{text-align:center;font:700 26px Montserrat,sans-serif;margin-top:34px}.fs{text-align:center;color:var(--au);letter-spacing:3px;font:500 12px Montserrat,sans-serif;margin-bottom:16px}
.inf{display:flex;align-items:center;gap:12px;margin:10px 18px;padding:14px;border:1px solid var(--ln);border-radius:18px;background:var(--c1)}
.inf i{width:44px;height:44px;border-radius:12px;background:var(--c2);display:grid;place-items:center;color:var(--au);flex:none}
.inf small{display:block;color:var(--au);font-size:12px;font-weight:700}
.dv{display:flex;align-items:center;gap:10px;margin:28px 18px 16px;color:var(--au)}
.dv::before,.dv::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--au))}.dv::after{transform:scaleX(-1)}
.cb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 4px;border:1px solid var(--ln);border-radius:20px;background:var(--c1);color:var(--tx);text-decoration:none;font-weight:700}
.ct i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--au);color:#241a06}
.ct i.wa{background:#25d366;color:#fff}.ct i.phone{background:#2a1c10;color:#fff}.ct svg{width:22px;height:22px}
.tg{text-align:center;font:italic 600 34px Montserrat,sans-serif;color:var(--au);margin:40px 18px 20px;line-height:1.25}
.pw{text-align:center;color:var(--mu);font:500 13px Montserrat,sans-serif;margin-bottom:10px}.pw span{border-bottom:1px solid var(--au);padding-bottom:1px}
.bar2{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar2 h1{font:700 20px 'Reem Kufi',serif}.bar2 i{width:44px}.bar2 .rb{background:var(--c1);color:var(--tx)}
nav{position:sticky;top:65px;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav button{flex:none;padding:8px 20px;border:1px solid var(--ln);background:var(--c1);border-radius:20px;font-weight:500;font-size:15px}
nav button.on{background:var(--au);color:#241a06;border-color:var(--au);font-weight:700}
.pd{padding:4px 18px}
h2{color:var(--au);font:700 20px 'Reem Kufi',serif;margin:22px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--ln);scroll-margin-top:130px}
.it{display:flex;align-items:baseline;gap:8px;padding:6px 2px}.it i{flex:1;border-bottom:2px dotted var(--ln)}.it b{color:var(--au);white-space:nowrap}
.note{text-align:center;font-size:13px;color:var(--mu);margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{border:1px solid var(--ln);border-radius:20px;background:var(--c1);overflow:hidden}.card.v{cursor:pointer}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card div{padding:12px 14px}.card h3{font-size:17px;color:var(--au)}.card p{font-size:14px;color:var(--mu)}
.play{display:inline-block;margin-top:6px;color:var(--au);font-weight:700;font-size:14px}
.lk{display:flex;justify-content:space-between;padding:16px;margin:10px 0;border:1px solid var(--ln);border-radius:16px;background:var(--c1);color:var(--tx);text-decoration:none;font-weight:700}
input,textarea,select{font:15px Tajawal,sans-serif;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--c2);color:var(--tx);width:100%;margin:2px 0}
.it input.n{flex:1}.it input.p{width:90px;text-align:center}
.x{border:0;background:#f3d9d4;color:#9b2c1e;padding:6px 10px;border-radius:8px;font-size:14px}
.add{margin:8px 0;border:1.5px dashed var(--au);background:none;color:var(--au);padding:8px 14px;border-radius:12px;font-size:14px}
.gh{display:flex;gap:6px;margin:22px 0 8px}.fld{display:block;margin:10px 0;font-size:14px;color:var(--mu)}
.ap{margin:26px 18px;padding:16px;border:1px dashed var(--au);border-radius:18px}.ap h3{color:var(--au);margin-bottom:6px}
.bc2{border:1px solid var(--ln);border-radius:14px;padding:10px;margin:10px 0}
